name: Mirror CI
run-name: Mirror CI ${{ github.sha }}

# Pull request verification. GitHub subculture-collective is the source: this
# runs on every pushed branch except main, and branch protection requires
# "Mirror CI gate" before a pull request can merge. Kvant mirrors main to
# Gitea, where .gitea/workflows run the main-branch jobs.
'on':
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    if: github.repository == 'subculture-collective/edda'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      go: ${{ steps.diff.outputs.go }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
      # Compare the branch with its merge base on main. Workflow changes and a
      # failed diff run everything.
      - name: List changed paths
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          if ! base=$(git merge-base origin/main HEAD) || ! files=$(git diff --name-only "$base" HEAD); then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "frontend=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          printf '%s\n' "$files"
          all=false; grep -q '^\.github/' <<<"$files" && all=true
          go=$all; grep -qvE '^(frontend/|docs/|[^/]*\.md$)' <<<"$files" && go=true
          frontend=$all; grep -q '^frontend/' <<<"$files" && frontend=true
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  test:
    name: Go tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Same command as `task test`, which the Gitea PR check ran.
      - name: Run tests
        run: go test ./...

  integration:
    name: PostgreSQL integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # Each tagged suite owns a fresh pgvector container through Testcontainers.
      # No application DSN or shared database is supplied to this job.
      - name: Run database-backed suites
        run: go test -tags integration -run Integration -count=1 -timeout 10m ./...

  frontend:
    name: Frontend image build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # Same build and nginx configuration check the Gitea PR run did before
      # its deploy steps, which only run on main. Nothing is pushed or deployed.
      - name: Build the frontend image and check its nginx configuration
        shell: bash
        run: |
          set -euo pipefail
          image="edda-web-verify:${GITHUB_SHA}"
          docker build -f frontend/Dockerfile -t "$image" frontend
          docker run --rm --network none --entrypoint nginx "$image" -t

  frontend-behavior:
    name: Frontend behavior
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check frontend behavior
        run: |
          pnpm test
          pnpm test:browser
          pnpm build

  mirror-gate:
    name: Mirror CI gate
    if: always() && github.repository == 'subculture-collective/edda'
    needs:
      - changes
      - test
      - integration
      - frontend
      - frontend-behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'changes', 'test', 'integration', 'frontend', 'frontend-behavior'}
          assert set(results) == expected, results
          assert results['changes']['result'] == 'success', 'change detection did not pass'
          # A job skipped because its area did not change counts as passing.
          for name, result in results.items():
              assert result["result"] in ("success", "skipped"), name + " did not pass"
          PY
